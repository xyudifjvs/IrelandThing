<body>
  <div id="__bundler_placeholder">Loading TC workspace...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

px\">{{g.n}}<\u002Fdiv><div class=\"mut\" style=\"margin-top:4px\">{{g.name}}<\u002Fdiv><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-for list=\"{{ listingRows }}\" as=\"l\" hint-placeholder-count=\"1\">\n            <div class=\"arow\" style=\"padding-left:0;padding-right:0;margin-top:10px\"><div style=\"flex:1 1 200px\"><div style=\"font-weight:700\">{{l.addr}}<\u002Fdiv><div class=\"mut\">Seller: {{l.seller}}<\u002Fdiv><\u002Fdiv><span class=\"pill p-up\">{{l.stage}}<\u002Fspan><button class=\"btn sm\" sc-camel-on-click=\"{{l.advance}}\">Next stage<\u002Fbutton><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsection>\n\n        <div class=\"cols\">\n          <section class=\"card\" style=\"flex:1.5 1 460px;min-width:0;overflow:hidden\">\n            <div style=\"padding:18px 18px 14px\"><h2 class=\"h2\">Needs attention<\u002Fh2><div class=\"mut\" style=\"margin-top:4px\">Every open deadline in the next 7 days, across all deals<\u002Fdiv><\u002Fdiv>\n            <sc-for list=\"{{ attention }}\" as=\"a\" hint-placeholder-count=\"5\">\n              <div class=\"arow\">\n                <span class=\"pill {{a.cls}}\" style=\"min-width:112px;justify-content:center\">{{a.when}}<\u002Fspan>\n                <div style=\"flex:1 1 200px;min-width:0\">\n                  <div style=\"font-weight:700\">{{a.label}}<\u002Fdiv>\n                  <div class=\"mut\">{{a.deal}}<\u002Fdiv>\n                <\u002Fdiv>\n                <button class=\"btn sm\" sc-camel-on-click=\"{{a.open}}\">Open<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ noAttention }}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"arow\"><span class=\"mut\">Nothing due this week. Nice.<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsection>\n\n          <div style=\"flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:24px\">\n            <section class=\"card\" style=\"overflow:hidden\">\n              <div style=\"padding:18px 18px 12px\"><h2 class=\"h2\">Active transactions<\u002Fh2><\u002Fdiv>\n              <sc-for list=\"{{ deals }}\" as=\"d\" hint-placeholder-count=\"3\">\n                <button class=\"arow\" style=\"width:100%;border-left:0;border-right:0;border-bottom:0;background:#fff;text-align:left;cursor:pointer;font:inherit;color:inherit;display:block\" sc-camel-on-click=\"{{d.open}}\">\n                  <div style=\"display:flex;justify-content:space-between;gap:12px;align-items:baseline\"><span style=\"font-weight:700\">{{d.name}}<\u002Fspan>\n                    <span class=\"mut\">Closes {{d.close}} · {{d.days}} days<\u002Fspan>\n                  <\u002Fdiv>\n                  <div class=\"mut\" style=\"margin:2px 0 10px\">{{d.addr}}<\u002Fdiv>\n                  <div class=\"bar\"><div style=\"width: {{d.pct}}%\"><\u002Fdiv><\u002Fdiv>\n                  <div class=\"mut\" style=\"margin-top:6px\">{{d.pct}}% of checklist done<\u002Fdiv>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fsection>\n\n            <section class=\"card\" style=\"overflow:hidden\">\n              <div style=\"padding:18px 18px 12px\"><h2 class=\"h2\">My to-do<\u002Fh2><div class=\"mut\" style=\"margin-top:4px\">Private. Agents and clients never see this.<\u002Fdiv><\u002Fdiv>\n              <sc-for list=\"{{ todosView }}\" as=\"t\" hint-placeholder-count=\"2\">\n                <div class=\"crow\" style=\"padding-left:8px\">\n                  <button class=\"chk\" aria-pressed=\"{{t.done}}\" aria-label=\"Mark to-do done\" sc-camel-on-click=\"{{t.toggle}}\"><span class=\"box {{t.boxCls}}\"><sc-if value=\"{{ t.done }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" aria-hidden=\"true\"><path d=\"M2 7.5l3.2 3L12 3.5\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fsc-if><\u002Fspan><\u002Fbutton>\n                  <span style=\"flex:1 1 160px;font-weight:500;{{t.textStyle}}\">{{t.text}}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fsection>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ========== NEW TRANSACTION: UPLOAD ========== -->\n    <sc-if value=\"{{ isUpload }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:960px\">\n        <div class=\"top\">\n          <div>\n            <h1 class=\"h1\">New transaction<\u002Fh1>\n            <p class=\"sub\">Drop in the fully executed contract. The AI reads the deadlines, you confirm them, and the checklist and emails fill themselves in.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <section class=\"card\" style=\"padding:22px;margin-bottom:24px\">\n          <h2 class=\"h2\" style=\"margin-bottom:12px\">Who are we representing?<\u002Fh2>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px\">\n            <sc-for list=\"{{ sideOpts }}\" as=\"o\" hint-placeholder-count=\"2\"><button class=\"rc {{o.cls}}\" aria-pressed=\"{{o.on}}\" sc-camel-on-click=\"{{o.pick}}\">{{o.name}}<\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv>\n          <h2 class=\"h2\" style=\"margin-bottom:12px\">Service level<\u002Fh2>\n          <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n            <sc-for list=\"{{ levelOpts }}\" as=\"o\" hint-placeholder-count=\"3\"><button class=\"tpl {{o.cls}}\" style=\"flex:1 1 200px;width:auto;border:1.5px solid #CFC5B6\" sc-camel-on-click=\"{{o.pick}}\"><div style=\"font-weight:700\">{{o.name}}<\u002Fdiv><div class=\"mut\" style=\"margin:4px 0\">{{o.desc}}<\u002Fdiv><div style=\"font-weight:700\">{{o.price}}<\u002Fdiv><\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv>\n          <p class=\"mut\" style=\"margin:14px 0 0\">This picks the right email set and broker file checklist for the file.<\u002Fp>\n        <\u002Fsection>\n        <div class=\"cols\">\n          <section class=\"card\" style=\"flex:1.4 1 380px;padding:22px\">\n            <h2 class=\"h2\" style=\"margin-bottom:14px\">Upload a contract<\u002Fh2>\n            <div class=\"drop\">\n              <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 16V4m0 0l-4 4m4-4l4 4M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3\" fill=\"none\" stroke=\"#6B5646\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n              <div style=\"font-weight:700;margin:10px 0 4px\">Drag a PDF here<\u002Fdiv>\n              <div class=\"mut\" style=\"margin-bottom:16px\">Purchase agreement plus any addenda<\u002Fdiv>\n              <button class=\"btn pri\" sc-camel-on-click=\"{{startExtract}}\">Use sample contract<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsection>\n          <section class=\"card\" style=\"flex:1 1 300px;padding:22px\">\n            <h2 class=\"h2\" style=\"margin-bottom:6px\">Or pull from Dotloop<\u002Fh2>\n            <p class=\"mut\" style=\"margin:0 0 16px;line-height:1.5\">Pick the loop and the platform grabs the executed contract and the people on it, so you do not even download a PDF.<\u002Fp>\n            <button class=\"btn\" sc-camel-on-click=\"{{startExtract}}\">Choose a loop<\u002Fbutton>\n          <\u002Fsection>\n          <section class=\"card\" style=\"flex:1 1 300px;padding:22px\">\n            <h2 class=\"h2\" style=\"margin-bottom:6px\">Not under contract yet?<\u002Fh2>\n            <p class=\"mut\" style=\"margin:0 0 14px;line-height:1.5\">Start a listing now. When a contract comes in, the same file carries on.<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <input class=\"txtIn\" aria-label=\"Property address\" placeholder=\"Property address\" value=\"{{newAddr}}\" sc-camel-on-change=\"{{onNewAddr}}\">\n              <input class=\"txtIn\" aria-label=\"Seller name\" placeholder=\"Seller name\" value=\"{{newSeller}}\" sc-camel-on-change=\"{{onNewSeller}}\">\n              <button class=\"btn\" sc-camel-on-click=\"{{addListing}}\">Add listing<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fdiv>\n        <section class=\"card\" style=\"padding:22px;margin-top:24px\">\n          <h2 class=\"h2\" style=\"margin-bottom:14px\">What happens next<\u002Fh2>\n          <div style=\"display:flex;flex-wrap:wrap;gap:20px\">\n            <div style=\"flex:1 1 180px\"><div class=\"pill p-dark\">1<\u002Fdiv><div style=\"font-weight:700;margin:8px 0 2px\">AI reads it<\u002Fdiv><div class=\"mut\">Finds every contingency and due date<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1 1 180px\"><div class=\"pill p-dark\">2<\u002Fdiv><div style=\"font-weight:700;margin:8px 0 2px\">You confirm<\u002Fdiv><div class=\"mut\">Anything uncertain is flagged for you<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1 1 180px\"><div class=\"pill p-dark\">3<\u002Fdiv><div style=\"font-weight:700;margin:8px 0 2px\">Checklist builds<\u002Fdiv><div class=\"mut\">Due dates drop into your template<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1 1 180px\"><div class=\"pill p-dark\">4<\u002Fdiv><div style=\"font-weight:700;margin:8px 0 2px\">Emails fill in<\u002Fdiv><div class=\"mut\">Dates and names merge automatically<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ========== EXTRACTING ========== -->\n    <sc-if value=\"{{ isExtract }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:620px;margin:40px auto 0\">\n        <section class=\"card\" style=\"padding:32px\">\n          <h1 class=\"h1\" style=\"font-size:26px\">Reading your contract…<\u002Fh1>\n          <p class=\"sub\" style=\"margin-bottom:22px\">This usually takes under a minute.<\u002Fp>\n          <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #EDE7DC\">\n              <span class=\"pill {{s.cls}}\" style=\"min-width:84px;justify-content:center\">{{s.state}}<\u002Fspan>\n              <span style=\"font-weight:600\">{{s.text}}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ========== REVIEW EXTRACTED DATES ========== -->\n    <sc-if value=\"{{ isReview }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:1000px\">\n        <div class=\"top\">\n          <div>\n            <h1 class=\"h1\">Check the dates the AI found<\u002Fh1>\n            <p class=\"sub\">{{foundCount}} deadlines found · {{flagCount}} need your eye. Fix anything that is off, then confirm.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n            <button class=\"btn\" sc-camel-on-click=\"{{goUpload}}\">Back<\u002Fbutton>\n            <button class=\"btn pri\" sc-camel-on-click=\"{{confirmFile}}\">Confirm and create file<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <section class=\"card\" style=\"overflow:hidden\">\n          <div class=\"crow\" style=\"background:#F1ECE3;min-height:44px;padding-left:18px\"><span class=\"mut\" style=\"flex:1 1 220px;font-weight:700\">Deadline<\u002Fspan><span class=\"mut\" style=\"width:116px;font-weight:700\">Date<\u002Fspan><span class=\"mut\" style=\"flex:1 1 200px;font-weight:700\">Found in<\u002Fspan><span class=\"mut\" style=\"width:96px;font-weight:700\">Confidence<\u002Fspan><\u002Fdiv>\n          <sc-for list=\"{{ reviewRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n            <div class=\"crow\" style=\"padding-left:18px;{{r.bg}}\">\n              <span style=\"flex:1 1 220px;font-weight:600\">{{r.label}}<\u002Fspan>\n              <input class=\"dateIn\" aria-label=\"Date for deadline\" value=\"{{r.val}}\" sc-camel-on-change=\"{{r.edit}}\">\n              <span class=\"mut\" style=\"flex:1 1 200px\">{{r.src}}<\u002Fspan>\n              <span class=\"pill {{r.cCls}}\" style=\"width:96px;justify-content:center\">{{r.cTxt}}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsection>\n        <p class=\"mut\" style=\"margin-top:14px\">N/A means the contract does not have that contingency, so it will be hidden on the client's timeline.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ========== DEAL FILE ========== -->\n    <sc-if value=\"{{ isDeal }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <section class=\"card\" style=\"padding:22px 24px;margin-bottom:20px\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-start\">\n            <div>\n              <h1 class=\"h1\">Cody &amp; Katrina<\u002Fh1>\n              <div class=\"sub\">214 Elm Street, Lancaster, OH · Agent: Dana Whitfield<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:12px\">\n                <span class=\"pill p-dark\">{{sideChip}}<\u002Fspan>\n                <span class=\"pill p-na\">{{levelChip}}<\u002Fspan>\n                <span class=\"pill p-na\">Cash<\u002Fspan>\n                <span class=\"pill p-up\">Synced with Dotloop<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:0 1 320px;min-width:240px\">\n              <div style=\"display:flex;justify-content:space-between;gap:12px;margin-bottom:8px\"><span style=\"font-weight:700\">Closing {{dealClose}}<\u002Fspan><span class=\"mut\">{{dealDays}} days to go<\u002Fspan><\u002Fdiv>\n              <div class=\"bar\"><div style=\"width: {{dealPct}}%\"><\u002Fdiv><\u002Fdiv>\n              <div class=\"mut\" style=\"margin-top:6px\">{{dealDone}} of {{dealTotal}} steps done<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <div class=\"cols\">\n          <div style=\"flex:1 1 560px;min-width:0\">\n            <div class=\"tabs\">\n              <button class=\"tab {{tabChecklistCls}}\" sc-camel-on-click=\"{{tabChecklist}}\">Checklist<\u002Fbutton>\n              <button class=\"tab {{tabEmailsCls}}\" sc-camel-on-click=\"{{tabEmails}}\">Emails<\u002Fbutton>\n              <sc-if value=\"{{ hasBroker }}\" hint-placeholder-val=\"{{ true }}\"><button class=\"tab {{tabBrokerCls}}\" sc-camel-on-click=\"{{tabBroker}}\">Broker file<\u002Fbutton><\u002Fsc-if>\n              <button class=\"tab {{tabNotesCls}}\" sc-camel-on-click=\"{{tabNotes}}\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><\u002Frect><path d=\"M8 11V8a4 4 0 018 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><\u002Fpath><\u002Fsvg>My notes &amp; to-do<\u002Fbutton>\n            <\u002Fdiv>\n\n            <!-- Checklist tab -->\n            <sc-if value=\"{{ showChecklist }}\" hint-placeholder-val=\"{{ true }}\">\n              <section class=\"card\" style=\"overflow:hidden\">\n                <div style=\"padding:16px 18px\"><span class=\"mut\">Change a date here and every email draft updates with it.<\u002Fspan><\u002Fdiv>\n                <sc-for list=\"{{ checklist }}\" as=\"it\" hint-placeholder-count=\"10\">\n                  <div class=\"crow {{it.rowCls}}\">\n                    <button class=\"chk\" aria-pressed=\"{{it.done}}\" aria-label=\"Mark step done\" sc-camel-on-click=\"{{it.toggle}}\"><span class=\"box {{it.boxCls}}\"><sc-if value=\"{{ it.done }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" aria-hidden=\"true\"><path d=\"M2 7.5l3.2 3L12 3.5\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fsc-if><\u002Fspan><\u002Fbutton>\n                    <div style=\"flex:1 1 200px;min-width:0\">\n                      <div style=\"font-weight:600;{{it.textStyle}}\">{{it.label}}<\u002Fdiv>\n                      <div class=\"mut\">{{it.note}}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <input class=\"dateIn\" aria-label=\"Due date\" value=\"{{it.val}}\" sc-camel-on-change=\"{{it.edit}}\">\n                    <span class=\"pill {{it.pCls}}\" style=\"min-width:128px;justify-content:center\">{{it.pTxt}}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fsection>\n            <\u002Fsc-if>\n\n            <!-- Emails tab -->\n            <sc-if value=\"{{ showEmails }}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"cols\">\n                <section class=\"card\" style=\"flex:0 1 280px;min-width:240px;padding:8px\">\n                  <div style=\"padding:10px 14px 2px;font-weight:700\">Emails to send ({{side}})<\u002Fdiv>\n                  <sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"4\">\n                    <div class=\"grp\">{{g.name}}<\u002Fdiv>\n                    <sc-for list=\"{{ g.items }}\" as=\"t\" hint-placeholder-count=\"6\">\n                      <button class=\"tpl {{t.cls}}\" style=\"padding:8px 14px\" sc-camel-on-click=\"{{t.pick}}\">\n                        <div style=\"font-weight:600;font-size:14px\">{{t.name}}<\u002Fdiv>\n                        <sc-if value=\"{{ t.soon }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"pill p-soon\" style=\"margin-top:4px\">Due soon<\u002Fspan><\u002Fsc-if>\n                        <sc-if value=\"{{ t.sent }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"pill p-done\" style=\"margin-top:4px\">Sent<\u002Fspan><\u002Fsc-if>\n                      <\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fsc-for>\n                <\u002Fsection>\n\n                <section class=\"card\" style=\"flex:1 1 360px;min-width:0;padding:20px 22px\">\n                  <div style=\"display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:8px\">\n                    <h2 class=\"h2\">{{mailName}}<\u002Fh2>\n                    <button class=\"btn sm\" aria-pressed=\"{{showFields}}\" sc-camel-on-click=\"{{toggleFields}}\">{{fieldsLabel}}<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div style=\"padding:12px 0;border-bottom:1px solid #EDE7DC\">\n                    <div class=\"mut\" style=\"font-weight:600;margin-bottom:8px\">To: people on this deal<\u002Fdiv>\n                    <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                      <sc-for list=\"{{ recips }}\" as=\"c\" hint-placeholder-count=\"5\">\n                        <button class=\"rc {{c.cls}}\" aria-pressed=\"{{c.on}}\" sc-camel-on-click=\"{{c.toggle}}\">{{c.name}} <span style=\"font-weight:500;opacity:.85\">{{c.roleLabel}}<\u002Fspan><\u002Fbutton>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                    <div class=\"mut\" style=\"margin-top:8px\">{{recipLine}}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div class=\"mrow\"><span>Subject<\u002Fspan><span style=\"font-weight:600\">{{mailSubject}}<\u002Fspan><\u002Fdiv>\n                  <div style=\"padding:12px 0;border-bottom:1px solid #EDE7DC\">\n                    <div class=\"mut\" style=\"font-weight:600;margin-bottom:8px\">Attachments<\u002Fdiv>\n                    <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center\">\n                      <sc-for list=\"{{ docChips }}\" as=\"d\" hint-placeholder-count=\"3\">\n                        <button class=\"rc {{d.cls}}\" aria-pressed=\"{{d.on}}\" sc-camel-on-click=\"{{d.toggle}}\">{{d.name}}<\u002Fbutton>\n                      <\u002Fsc-for>\n                      <sc-for list=\"{{ uploaded }}\" as=\"u\" hint-placeholder-count=\"0\">\n                        <button class=\"rc on\" aria-label=\"Remove attachment\" sc-camel-on-click=\"{{u.remove}}\">{{u.name}} ×<\u002Fbutton>\n                      <\u002Fsc-for>\n                      <label class=\"btn sm\" for=\"mailFile\">Upload a file<\u002Flabel>\n                      <input id=\"mailFile\" type=\"file\" sc-camel-on-change=\"{{onFile}}\" style=\"position:absolute;width:1px;height:1px;opacity:0\">\n                    <\u002Fdiv>\n                    <div class=\"mut\" style=\"margin-top:8px\">Deal documents are pulled from Dotloop. Upload anything else from your computer.<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"padding:16px 0 18px\">\n                    <sc-if value=\"{{ showFields }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div class=\"mail\" style=\"background:#FBF8F3;border:1px solid #E9E2D6;border-radius:10px;padding:16px 18px\">{{mailRaw}}<\u002Fdiv>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ notShowFields }}\" hint-placeholder-val=\"{{ true }}\">\n                      <textarea class=\"ta\" style=\"min-height:340px;font:400 15px/1.65 'Montserrat',system-ui,sans-serif\" aria-label=\"Email message\" value=\"{{mailBody}}\" sc-camel-on-change=\"{{onBody}}\"><\u002Ftextarea>\n                      <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px\">\n                        <span class=\"mut\">Dates and names are filled in. Tweak anything before sending.<\u002Fspan>\n                        <sc-if value=\"{{ bodyEdited }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn sm\" sc-camel-on-click=\"{{resetBody}}\">Reset to template<\u002Fbutton><\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center\">\n                    <button class=\"btn pri\" sc-camel-on-click=\"{{sendMail}}\">{{sendLabel}}<\u002Fbutton>\n                    <span class=\"mut\">Sends from your own email address and logs it on this file.<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsection>\n              <\u002Fdiv>\n              <section class=\"card\" style=\"padding:16px 20px;margin-top:20px\">\n                <h2 class=\"h2\" style=\"font-size:16px;margin-bottom:6px\">Sent from this file<\u002Fh2>\n                <sc-if value=\"{{ noLog }}\" hint-placeholder-val=\"{{ true }}\"><div class=\"mut\">Nothing sent yet.<\u002Fdiv><\u002Fsc-if>\n                <sc-for list=\"{{ log }}\" as=\"l\" hint-placeholder-count=\"1\">\n                  <div class=\"mrow\"><span style=\"flex:0 0 72px\">{{l.when}}<\u002Fspan><span><b>{{l.subject}}<\u002Fb> · to {{l.to}}<\u002Fspan><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fsection>\n            <\u002Fsc-if>\n\n            <!-- Broker file tab -->\n            <sc-if value=\"{{ showBroker }}\" hint-placeholder-val=\"{{ false }}\">\n              <section class=\"card\" style=\"overflow:hidden\">\n                <div style=\"padding:16px 18px\"><div style=\"font-weight:700\">{{brokerTitle}} · {{brokerDone}} of {{brokerTotal}} complete<\u002Fdiv><div class=\"mut\" style=\"margin-top:4px\">Tap a status to move it along. Once Dotloop is connected, it fills in on its own.<\u002Fdiv><\u002Fdiv>\n                <sc-for list=\"{{ brokerRows }}\" as=\"b\" hint-placeholder-count=\"12\">\n                  <sc-if value=\"{{ b.isHead }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"grp\" style=\"background:#F1ECE3;border-top:1px solid #E6DFD3\">{{b.label}}<\u002Fdiv><\u002Fsc-if>\n                  <sc-if value=\"{{ b.isDoc }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div class=\"crow\">\n                      <div style=\"flex:1 1 220px;min-width:0\"><div style=\"font-weight:600;{{b.textStyle}}\">{{b.label}}<\u002Fdiv><div class=\"mut\">{{b.who}}<\u002Fdiv><\u002Fdiv>\n                      <button class=\"btn sm\" style=\"min-width:170px\" sc-camel-on-click=\"{{b.cycle}}\"><span class=\"pill {{b.cls}}\">{{b.st}}<\u002Fspan><\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fsc-for>\n              <\u002Fsection>\n            <\u002Fsc-if>\n\n            <!-- Notes tab -->\n            <sc-if value=\"{{ showNotes }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:#FCEBD3;color:#5E3204;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-weight:600;font-size:14.5px\">Private to you. The agent and client portals never show anything on this tab.<\u002Fdiv>\n              <div class=\"cols\">\n                <section class=\"card\" style=\"flex:1 1 300px;min-width:0;padding:18px 20px\">\n                  <h2 class=\"h2\" style=\"margin-bottom:10px\">My to-do<\u002Fh2>\n                  <sc-for list=\"{{ todosView }}\" as=\"t\" hint-placeholder-count=\"2\">\n                    <div class=\"crow\" style=\"padding-left:0;padding-right:0\">\n                      <button class=\"chk\" aria-pressed=\"{{t.done}}\" aria-label=\"Mark to-do done\" sc-camel-on-click=\"{{t.toggle}}\"><span class=\"box {{t.boxCls}}\"><sc-if value=\"{{ t.done }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" aria-hidden=\"true\"><path d=\"M2 7.5l3.2 3L12 3.5\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fsc-if><\u002Fspan><\u002Fbutton>\n                      <span style=\"flex:1 1 140px;font-weight:500;{{t.textStyle}}\">{{t.text}}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <div style=\"display:flex;gap:8px;margin-top:12px\">\n                    <input class=\"txtIn\" aria-label=\"New to-do\" placeholder=\"Add a to-do, like: call title tomorrow 9am\" value=\"{{todoDraft}}\" sc-camel-on-change=\"{{onTodoDraft}}\">\n                    <button class=\"btn\" sc-camel-on-click=\"{{addTodo}}\">Add<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsection>\n                <section class=\"card\" style=\"flex:1.2 1 340px;min-width:0;padding:18px 20px\">\n                  <h2 class=\"h2\" style=\"margin-bottom:10px\">Notes on this transaction<\u002Fh2>\n                  <textarea class=\"ta\" aria-label=\"New note\" placeholder=\"Write a note about this deal\" value=\"{{noteDraft}}\" sc-camel-on-change=\"{{onNoteDraft}}\"><\u002Ftextarea>\n                  <div style=\"margin:10px 0 14px\"><button class=\"btn\" sc-camel-on-click=\"{{addNote}}\">Save note<\u002Fbutton><\u002Fdiv>\n                  <sc-for list=\"{{ notes }}\" as=\"n\" hint-placeholder-count=\"1\">\n                    <div style=\"padding:12px 0;border-top:1px solid #EDE7DC\"><div class=\"mut\" style=\"margin-bottom:4px\">{{n.when}}<\u002Fdiv><div style=\"line-height:1.55\">{{n.text}}<\u002Fdiv><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fsection>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <aside style=\"flex:0 1 300px;min-width:260px;display:flex;flex-direction:column;gap:20px\">\n            <section class=\"card\" style=\"padding:18px 20px\">\n              <h2 class=\"h2\" style=\"font-size:17px;margin-bottom:10px\">People on this deal<\u002Fh2>\n              <p class=\"mut\" style=\"margin:0 0 6px;line-height:1.5\">Add everyone once. They show up as recipients on every email for this deal.<\u002Fp>\n              <sc-for list=\"{{ contactList }}\" as=\"p\" hint-placeholder-count=\"5\">\n                <div class=\"mrow\" style=\"flex-direction:column;gap:2px\">\n                  <span style=\"flex:0 0 auto;font-weight:700;color:#1A1714\">{{p.name}}<\u002Fspan>\n                  <span class=\"mut\">{{p.roleLabel}} · {{p.email}}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"margin-top:14px;display:flex;flex-direction:column;gap:8px\">\n                <div style=\"font-weight:700\">Add a person<\u002Fdiv>\n                <input class=\"txtIn\" aria-label=\"Name\" placeholder=\"Name\" value=\"{{newName}}\" sc-camel-on-change=\"{{onNewName}}\">\n                <input class=\"txtIn\" aria-label=\"Email address\" placeholder=\"Email address\" value=\"{{newEmail}}\" sc-camel-on-change=\"{{onNewEmail}}\">\n                <sc-raw-select class=\"sel\" aria-label=\"Role\" value=\"{{newRole}}\" sc-camel-on-change=\"{{onNewRole}}\">\n                  <option value=\"lender\">Lender<\u002Foption>\n                  <option value=\"coop\">Co-op agent<\u002Foption>\n                  <option value=\"title\">Title rep<\u002Foption>\n                  <option value=\"client\">Client<\u002Foption>\n                  <option value=\"agent\">My agent<\u002Foption>\n                  <option value=\"other\">Other<\u002Foption>\n                <\u002Fsc-raw-select>\n                <button class=\"btn\" sc-camel-on-click=\"{{addContact}}\">Add to this deal<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsection>\n            <section class=\"card\" style=\"padding:18px 20px\">\n              <h2 class=\"h2\" style=\"font-size:17px;margin-bottom:6px\">Who can see this<\u002Fh2>\n              <p class=\"mut\" style=\"margin:0 0 12px;line-height:1.5\">You: everything. Agent: the whole file except your private notes. Client: a simple timeline.<\u002Fp>\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <button class=\"btn\" sc-camel-on-click=\"{{inviteAgent}}\">{{inviteLabel}}<\u002Fbutton>\n                <button class=\"btn\" sc-camel-on-click=\"{{copyLink}}\">Copy client link<\u002Fbutton>\n                <a class=\"btn sm\" href=\"Agent.dc.html\">Preview agent view<\u002Fa>\n                <a class=\"btn sm\" href=\"Client.dc.html\">Preview client view<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fsection>\n          <\u002Faside>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ========== INBOX ========== -->\n    <sc-if value=\"{{ isInbox }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div class=\"top\"><div><h1 class=\"h1\">Inbox<\u002Fh1><p class=\"sub\">Connected to your Gmail. Only emails from people on your active deals show up here.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div class=\"cols\">\n          <section class=\"card\" style=\"flex:0 1 340px;min-width:260px;padding:8px\">\n            <sc-for list=\"{{ inboxList }}\" as=\"m\" hint-placeholder-count=\"4\">\n              <button class=\"tpl {{m.cls}}\" sc-camel-on-click=\"{{m.pick}}\">\n                <div style=\"display:flex;justify-content:space-between;gap:8px\"><b>{{m.from}}<\u002Fb><span class=\"mut\">{{m.when}}<\u002Fspan><\u002Fdiv>\n                <div style=\"font-weight:600;margin-top:2px\">{{m.subject}}<\u002Fdiv>\n                <div style=\"margin-top:6px\"><span class=\"pill {{m.pCls}}\">{{m.tag}}<\u002Fspan><\u002Fdiv>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fsection>\n          <div style=\"flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:16px\">\n            <sc-if value=\"{{ showReview }}\" hint-placeholder-val=\"{{ true }}\">\n              <section class=\"card\" style=\"padding:20px 22px;border-color:#C9833A;background:#FFF8EE\">\n                <h2 class=\"h2\" style=\"margin-bottom:8px\">Suggested update<\u002Fh2>\n                <p style=\"margin:0 0 12px;line-height:1.55\">I see an EMD receipt for <b>214 Elm Street<\u002Fb> from Jess Miller at Valmer Title. She is on this deal, so this looks legitimate. Want me to mark earnest money done and update everyone's timelines?<\u002Fp>\n                <div class=\"mut\" style=\"margin-bottom:14px;line-height:1.6\">Will update: your checklist, Dana's agent portal, and Cody and Katrina's client link.<\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:10px\"><button class=\"btn pri\" sc-camel-on-click=\"{{approveEmd}}\">Approve and update<\u002Fbutton><button class=\"btn\" sc-camel-on-click=\"{{dismissEmd}}\">Not this deal<\u002Fbutton><\u002Fdiv>\n              <\u002Fsection>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ showApplied }}\" hint-placeholder-val=\"{{ false }}\">\n              <section class=\"card\" style=\"padding:20px 22px;border-color:#B9C7A5;background:#F4F7EE\">\n                <h2 class=\"h2\" style=\"margin-bottom:8px\">Done. Earnest money is marked complete.<\u002Fh2>\n                <p style=\"margin:0 0 14px;line-height:1.55\">The checklist, agent portal, and client link are all updated. Next, send the receipt to Cody, Katrina, and Dana.<\u002Fp>\n                <button class=\"btn pri\" sc-camel-on-click=\"{{goEmdEmail}}\">Review the email to send<\u002Fbutton>\n              <\u002Fsection>\n            <\u002Fsc-if>\n            <section class=\"card\" style=\"padding:20px 22px\">\n              <h2 class=\"h2\">{{mSubject}}<\u002Fh2>\n              <div class=\"mut\" style=\"margin:4px 0 12px\">From {{mFrom}}<\u002Fdiv>\n              <sc-if value=\"{{ mAtt }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"margin-bottom:12px\"><span class=\"chip\">{{mAttName}}<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n              <div class=\"mail\">{{mBody}}<\u002Fdiv>\n            <\u002Fsection>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ========== EMAIL TEMPLATE LIBRARY ========== -->\n    <sc-if value=\"{{ isTemplates }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div class=\"top\">\n          <div>\n            <h1 class=\"h1\">Settings<\u002Fh1>\n            <p class=\"sub\">Edit your email templates and checklist steps any time. Changes apply to new deals.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cols\">\n          <section class=\"card\" style=\"flex:0 1 300px;min-width:240px;padding:8px\">\n            <sc-for list=\"{{ libList }}\" as=\"t\" hint-placeholder-count=\"7\">\n              <button class=\"tpl {{t.cls}}\" sc-camel-on-click=\"{{t.pick}}\">\n                <div style=\"font-weight:700\">{{t.name}}<\u002Fdiv>\n                <div class=\"mut\" style=\"margin-top:4px\">{{t.stage}} · to {{t.to}}<\u002Fdiv>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fsection>\n          <section class=\"card\" style=\"flex:1 1 400px;min-width:0;padding:20px 24px\">\n            <h2 class=\"h2\" style=\"margin-bottom:4px\">{{libName}}<\u002Fh2>\n            <div style=\"margin:10px 0 12px\"><input class=\"txtIn\" aria-label=\"Subject\" value=\"{{libSubject}}\" sc-camel-on-change=\"{{onLibSubject}}\"><\u002Fdiv>\n            <textarea class=\"ta\" style=\"min-height:300px;font:400 15px/1.65 'Montserrat',system-ui,sans-serif\" aria-label=\"Email body\" value=\"{{libBody}}\" sc-camel-on-change=\"{{onLibBody}}\"><\u002Ftextarea>\n            <h2 class=\"h2\" style=\"font-size:15px;margin:20px 0 10px\">Merge fields available<\u002Fh2>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n              <sc-for list=\"{{ fieldChips }}\" as=\"f\" hint-placeholder-count=\"6\">\n                <span class=\"chip\">{{f.name}}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fdiv>\n        <section class=\"card\" style=\"padding:20px 24px;margin-top:24px\">\n          <h2 class=\"h2\" style=\"margin-bottom:4px\">Checklist steps<\u002Fh2>\n          <p class=\"mut\" style=\"margin:0 0 14px;line-height:1.5\">Add a step to the contract-to-close checklist, with a date rule. Its date also becomes a merge field in your emails.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center\">\n            <div style=\"flex:2 1 240px\"><input class=\"txtIn\" aria-label=\"Step name\" placeholder=\"Step name, like: Wiring instructions sent\" value=\"{{stepName}}\" sc-camel-on-change=\"{{onStepName}}\"><\u002Fdiv>\n            <div style=\"flex:1 1 170px\"><input class=\"txtIn\" aria-label=\"Days before closing\" placeholder=\"Days before closing\" value=\"{{stepDays}}\" sc-camel-on-change=\"{{onStepDays}}\"><\u002Fdiv>\n            <button class=\"btn\" sc-camel-on-click=\"{{addStep}}\">Add to checklist<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"mut\" style=\"margin-top:10px\">{{stepsLine}}<\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"toast\" role=\"status\">{{toastText}}<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:1000}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      screen: 'dash',\n      tab: 'checklist',\n      step: 0,\n      sel: '',\n      libSel: 'welcome',\n      side: 'buyer', level: 'complete', newSide: 'buyer', newLevel: 'complete',\n      newAddr: '', newSeller: '',\n      listings: [{ id: 'l1', addr: '77 Willow Ln', seller: 'Sample Seller', stage: 1 }],\n      bf: { buyer: this.mkBF('buyer'), seller: this.mkBF('seller') },\n      tplEdit: {}, inboxSel: 0, inboxDone: false, inboxDismiss: false,\n      stepName: '', stepDays: '', customSteps: [],\n      showFields: false,\n      sent: {},\n      log: [],\n      toastText: '',\n      invited: false,\n      recip: {},\n      att: {},\n      bodyEdit: {},\n      newName: '',\n      newEmail: '',\n      newRole: 'lender',\n      contacts: [\n        { id: 'c1', name: 'Cody', role: 'client', email: 'cody@example.com' },\n        { id: 'c2', name: 'Katrina', role: 'client', email: 'katrina@example.com' },\n        { id: 'c3', name: 'Dana Whitfield', role: 'agent', email: 'dana@example.com' },\n        { id: 'c4', name: 'Sam Patel', role: 'coop', email: 'sam@example.com' },\n        { id: 'c5', name: 'Jess Miller', role: 'title', email: 'jess@valmertitle.example' },\n        { id: 'c6', name: 'Priya Shah', role: 'lender', email: 'priya@example.com' }\n      ],\n      todoDraft: '',\n      noteDraft: '',\n      todos: [\n        { id: 't1', text: 'Check in with title tomorrow morning', done: false },\n        { id: 't2', text: 'Ask Cody and Katrina for utility info', done: false },\n        { id: 't3', text: 'Upload signed contract to Dotloop folder', done: true }\n      ],\n      notes: [\n        { id: 'n1', when: 'Oct 13', text: 'Remedies negotiated is due 10/14. Follow up with the listing agent first thing tomorrow.' }\n      ],\n      items: [\n        { id: 'vod', label: 'Pre-approval / VOD', ml: 'VOD', val: 'Provided', done: true, src: 'Financing section', flag: false, note: 'Proof of funds on file' },\n        { id: 'loanapp', label: 'Loan application', ml: 'Loan Application', val: 'N/A', done: false, src: 'Financing section', flag: false, note: 'Cash purchase' },\n        { id: 'emd', label: 'Earnest money (EMD)', ml: 'Earnest Money', val: '10/17', done: false, src: 'Earnest Money section', flag: false, note: 'Valmer Title, Lancaster &middot; $1,000', tpl: '[v] held with Valmer Title in Lancaster  Amount: $1,000' },\n        { id: 'atty', label: 'Attorney review', ml: 'Attorney Review', val: 'N/A', done: false, src: 'Contingencies', flag: false, note: '' },\n        { id: 'insp', label: 'Inspections', ml: 'Inspections', val: '10/11', done: true, src: 'Inspection contingency', flag: false, note: '' },\n        { id: 'rem', label: 'Remedies', ml: 'Remedies', val: '10/11', done: true, src: 'Inspection contingency', flag: false, note: 'Repair request sent' },\n        { id: 'remneg', label: 'Remedies negotiated', ml: 'Remedies Negotiated', val: '10/14', done: false, src: 'Inspection contingency', flag: true, note: 'Calculated from the remedies date' },\n        { id: 'warr', label: 'Home warranty ordered', ml: 'Warranty Ordered', val: '', done: false, src: 'Warranty addendum', flag: true, note: \"America's Preferred Home Warranty\", tpl: \"America's Preferred Home Warranty\" },\n        { id: 'hoaprov', label: 'Condo / HOA docs provided', ml: 'Condo / HOA Doc Provision', val: '10/9', done: true, src: 'HOA addendum', flag: false, note: 'Received', tpl: '[v] - Received' },\n        { id: 'hoarev', label: 'Condo / HOA docs reviewed', ml: 'Condo / HOA Doc Review', val: '10/14', done: false, src: 'HOA addendum', flag: false, note: 'Client review window' },\n        { id: 'apprord', label: 'Appraisal ordered', ml: 'Appraisal Ordered', val: 'N/A', done: false, src: 'Financing section', flag: false, note: '' },\n        { id: 'apprcomp', label: 'Appraisal completed', ml: 'Appraisal Completed', val: 'N/A', done: false, src: 'Financing section', flag: false, note: '', skipMail: true },\n        { id: 'loancom', label: 'Loan commitment', ml: 'Loan Commitment', val: 'N/A', done: false, src: 'Financing section', flag: false, note: '' },\n        { id: 'title', label: 'Title commitment', ml: 'Title Commitment', val: '10/15', done: false, src: 'Title section', flag: false, note: 'Valmer Title' },\n        { id: 'walk', label: 'Final walkthrough', ml: 'Final Walkthrough', val: '10/27', done: false, src: 'Closing section', flag: true, note: 'Within 3 days of closing', tpl: 'Within 3 days of closing ([v])' },\n        { id: 'close', label: 'Closing date', ml: 'Closing Date', val: '10/30', done: false, src: 'Closing section', flag: false, note: '', tpl: 'on or before [v]' },\n        { id: 'poss', label: 'Possession date and time', ml: 'Possession Date & Time', val: '10/30', done: false, src: 'Closing section', flag: false, note: 'At closing / funding', tpl: 'Date and time of closing/funding' }\n      ]\n    };\n  }\n\n  /* ---------- helpers ---------- */\n  isDate(v) { return /^\\d{1,2}\\/\\d{1,2}$/.test((v || '').trim()); }\n  daysTo(v) {\n    if (!this.isDate(v)) return NaN;\n    const p = v.trim().split('/');\n    const d = new Date(2026, parseInt(p[0], 10) - 1, parseInt(p[1], 10));\n    const t = new Date(2026, 9, 13);\n    return Math.round((d - t) / 86400000);\n  }\n  itemById(id) { return this.state.items.find((i) => i.id === id); }\n  plain(s) { return (s || '').replace(/&middot;/g, '·').replace(/&amp;/g, '&'); }\n  toast(msg) {\n    this.setState({ toastText: msg });\n    setTimeout(() => this.setState({ toastText: '' }), 2600);\n  }\n  patch(id, p) {\n    this.setState({ items: this.state.items.map((i) => (i.id === id ? Object.assign({}, i, p) : i)) });\n  }\n  statusOf(it) {\n    const d = this.daysTo(it.val);\n    if (it.val === 'N/A') return { k: 'na', cls: 'p-na', txt: 'N/A', d: NaN };\n    if (it.done) return { k: 'done', cls: 'p-done', txt: 'Done', d: d };\n    if (isNaN(d)) {\n      if (!it.val) return { k: 'set', cls: 'p-set', txt: 'Add a date', d: NaN };\n      return { k: 'up', cls: 'p-up', txt: it.val, d: NaN };\n    }\n    if (d < 0) return { k: 'over', cls: 'p-over', txt: 'Overdue ' + (-d) + 'd', d: d };\n    if (d === 0) return { k: 'soon', cls: 'p-soon', txt: 'Due today', d: d };\n    if (d === 1) return { k: 'soon', cls: 'p-soon', txt: 'Due tomorrow', d: d };\n    if (d <= 3) return { k: 'soon', cls: 'p-soon', txt: 'Due in ' + d + ' days', d: d };\n    return { k: 'up', cls: 'p-up', txt: 'In ' + d + ' days', d: d };\n  }\n  emailValue(it) {\n    if (it.tpl) return it.tpl.replace('[v]', it.val);\n    return it.val || 'TBD';\n  }\n\n  mkBF(side) {\n    const P = {\n      buyer: [\n        ['Offer', 'Consumer Guide;Agency Disclosure;RPD;HTO Team disclosure;LBP (if applicable);PreApproval Letter;POF for Cash / Gap;Purchase Contract;SA Commission Split Agreement (Katrina)'],\n        ['Acceptance', 'Affiliated Busi , 'PreApproval Letter', 'POF for Cash / Gap', 'Inspections', 'Request to Remedy', 'ERS Listing Agreement', 'Residential Input Form'];\n    const OUT = ['Remedy Receipts', 'Affiliated Business Disclosure', 'Brokerage Exclusive'];\n    const who = side === 'buyer' ? 'Cody and Katrina' : 'Seller';\n    const out = [];\n    P[side].forEach((ph, pi) => ph[1].split(';').forEach((label, i) => {\n      out.push({ id: side + pi + '_' + i, ph: ph[0], label: label, who: SIGN.indexOf(label) >= 0 ? who : '', st: DONE.indexOf(label) >= 0 ? 'Signed' : (OUT.indexOf(label) >= 0 ? 'Out for signature' : 'Needed') });\n    }));\n    return out;\n  }\n\n  templates() {\n    const E = this.state.tplEdit;\n    return this.baseTemplates().map((x) => (E[x.id] ? Object.assign({}, x, E[x.id]) : x));\n  }\n\n  emailGroups(side, tpls) {\n    const byId = {};\n    tpls.forEach((x) => { byId[x.id] = x; });\n    const DR = { welcome: ['coop', 'title'], emd: ['client', 'agent'], emdrcpt: ['client', 'agent'], remneg: ['agent'], hoarev: ['client'], close: ['client', 'agent'] };\n    const D = {\n      buyer: [\n        ['To buyer', 'client', 'Contract to close;Title company info;EMD receipt|emdrcpt;Utility and service provider;Title commitment;Closing prep: walkthrough and closing|walk;ALTA for review and wiring instructions sent;Follow-up and review request'],\n        ['To listing agent', 'coop', 'Timeline and title info request|welcome;Intro to lender and loan app made;Inspection satisfied;EMD receipt|emdrcpt;Appraisal satisfied or concern;Loan commitment and closing;List Katrina as selling agent and HTO agent as co-agent'],\n        ['To lender', 'lender', 'Intro and title info;Loan app confirmation;Appraisal order confirmation;Appraisal complete confirmation;Request for loan commitment;CD and Closing Disclosure sent to buyer;On track for closing date'],\n        ['To title', 'title', 'Client, lender, commission;Title commitment request|title;Closing prep: schedule closing;Request ALTA for review
