# Local dependencies only. Run application processes on the host with npm run dev.
# This creates a separate compose project; it never reuses the preview container.
name: weatherly-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: weatherly
      POSTGRES_PASSWORD: weatherly_local_only
      POSTGRES_DB: weatherly
    ports:
      - "127.0.0.1:${WEATHERLY_DB_PORT:-55442}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weatherly -d weatherly"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
